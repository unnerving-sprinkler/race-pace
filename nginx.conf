server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # No caching for the small static assets so edits show up immediately.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
    }
}
